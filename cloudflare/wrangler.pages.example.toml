# PLANTILLA DE EJEMPLO — NO ES CONFIGURACIÓN ACTIVA.
# Cloudflare Pages admite "Direct Upload" sin este archivo: los scripts de
# despliegue usan `npx wrangler pages deploy ... --project-name=...`.
# Si el usuario decide versionar una configuración, debe copiar este archivo a
# `wrangler.toml` en la raíz y sustituir TODOS los placeholders `<...>`.
# No incluir credenciales ni IDs reales en el repositorio.

# Nombre del proyecto Pages (público o privado) existente en la cuenta del usuario.
name = "<PROJECT_NAME>"

# Fecha de compatibilidad; ajustar a la fecha elegida por el usuario.
compatibility_date = "2026-11-24"

# Directorio generado por el build; dist-public o dist-studio según el proyecto.
pages_build_output_dir = "<DIST_PUBLIC_OR_DIST_STUDIO>"
