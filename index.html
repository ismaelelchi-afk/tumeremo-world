      <section>
        <h1>Tumeremo Worlds: mapa digital 3D de Tumeremo, Municipio Sifontes, Bolívar</h1>
        <p>
          Tumeremo, Venezuela. Explora un mapa real con calles y lugares de OpenStreetMap y una
          capa digital superpuesta de construcciones, objetos y comercios de demostración.
        </p>
        <h2>Mapa real con capas digitales</h2>
        <p>
          Las calles y los lugares proceden de OpenStreetMap y se sirven con teselas vectoriales
          de OpenFreeMap. Las construcciones y los comercios marcados como demostración son
          ficticios y sirven para probar la plataforma; no alteran la geografía original.
        </p>
        <h2>Cobertura y límites de los datos</h2>
        <p>
          La cobertura medida usa teselas z14, unas 20 teselas (aproximadamente 12 × 10 km)
          alrededor de la ciudad. En la región medida hay alrededor de 630 tramos viales
          mapeados en OSM, 140 puntos de interés con nombre y 30 polígonos de edificios.
          Esta versión no incluye relieve (terreno).
        </p>
        <h2>Cómo explorar el directorio</h2>
        <p>
          Busca y filtra lugares, construcciones y comercios; abre una ficha para ver sus
          detalles y vuelve al centro de Tumeremo. Los comercios de demostración no son
          negocios reales ni contactos comerciales.
        </p>
      </section>
